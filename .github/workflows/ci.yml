name: CI
on:
  push: { branches: [main, "claude/**"] }
  pull_request:

jobs:
  test:
    runs-on: macos-15 # default Xcode 16.x — reads XcodeGen's project format 77
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      # Some macos-15 image variants ship WITHOUT the iOS simulator runtime
      # (run 30880408413 had zero iOS destinations). Create the HR-4 reference
      # device explicitly instead of hoping the image includes it.
      - name: Prepare iOS simulator (HR-4 reference device)
        run: |
          set -o pipefail
          if ! xcrun simctl list runtimes | grep -q "^iOS"; then
            echo "No iOS runtime on this image — downloading (adds a few minutes)"
            sudo xcodebuild -downloadPlatform iOS
          fi
          RUNTIME=$(xcrun simctl list runtimes | awk '/^iOS/ {id=$NF} END {print id}')
          echo "Using runtime: $RUNTIME"
          xcrun simctl create "iPad10-CI" \
            "com.apple.CoreSimulator.SimDeviceType.iPad-10th-generation" "$RUNTIME"
      # Snapshot baselines are device-specific: pin the HR-4 reference device.
      # pipefail is load-bearing: without it a failing xcodebuild piped anywhere
      # reports success (the false-green this workflow shipped with once).
      - name: Run tests (iPad 10th gen — HR-4 reference device)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Sol \
            -destination 'platform=iOS Simulator,name=iPad10-CI' \
            -resultBundlePath TestResults
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
